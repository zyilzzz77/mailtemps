name: mailtemps

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailtemps}
      POSTGRES_USER: ${POSTGRES_USER:-mailtemps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/database/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [mailtemps_private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [mailtemps_private]

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: ["/app/mailtemps-api"]
    env_file: [.env]
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [mailtemps_private]

  smtp:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: ["/app/mailtemps-smtp"]
    env_file: [.env]
    ports:
      - "${SMTP_BIND_IP:-127.0.0.1}:${SMTP_PUBLIC_PORT:-2525}:2525"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mailtemps_private]

  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    command: ["/app/mailtemps-worker"]
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mailtemps_private]

  web:
    build:
      context: ./web
      args:
        API_PROXY_TARGET: http://api:8081
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8081
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [mailtemps_private]

networks:
  mailtemps_private:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

