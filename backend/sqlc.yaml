version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations/000001_init.up.sql
    queries: internal/database/queries
    gen:
      go:
        package: database
        out: internal/database/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID

